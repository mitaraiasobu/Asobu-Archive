<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>遊アーカイブ | 御手洗 遊</title>
  <link rel="icon" href="./assets/siteicon.png" type="image/png" />
  <link rel="stylesheet" href="./styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&family=Kaisei+Tokumin:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <style>
    .temp-wrap{
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .temp-card{
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 36px 28px;
      text-align: center;
    }
    .temp-img{
      max-width: 260px;
      width: 100%;
      height: auto;
      border-radius: 14px;
      margin: 0 auto 24px;
      display: block;
    }
    .temp-text{
      color: var(--text);
      font-size: 17px;
      line-height: 1.9;
      white-space: pre-line;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="temp-wrap">
    <div class="temp-card">
      <img class="temp-img" src="./assets/aroma.png" alt="" />
      <p class="temp-text">ボイスは現在準備中です。</br>ボイスを実装したらXやYouTubeでお知らせします。</br>良い子で待っててね🤍</p>
    </div>
  </div>
</body>
</html>
